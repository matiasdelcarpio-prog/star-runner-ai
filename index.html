<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Star Runner AI: elige una plaza de Córdoba, corre y recoge las estrellas del mapa.">
    <title>Star Runner AI - Hacktoberfest W1</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">

    <!-- Nada de esto bloquea la primera pantalla: el CSS propio es mínimo y los scripts son diferidos -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
    <script type="module" src="app.js"></script>
</head>
<body data-screen="setup">
<main id="app">

    <!-- PANTALLA 1: ELEGIR PLAZA -->
    <section id="screen-setup" class="screen" aria-labelledby="title-setup">
        <header class="center">
            <h1 id="title-setup" tabindex="-1" class="title">⭐ Star Runner AI</h1>
            <p class="muted">Hacktoberfest 2026 - ¡A tocar pasto!</p>
        </header>

        <form id="setup-form" class="card stack" autocomplete="off">
            <div class="stack-sm">
                <label for="location" class="label">¿En qué plaza o parque de Córdoba estás?</label>
                <input type="text" id="location" name="location" maxlength="100"
                       placeholder="Ej: Plaza San Martín" enterkeyhint="search"
                       autocapitalize="words" spellcheck="false" required>
                <div class="chips" aria-label="Sugerencias">
                    <button type="button" class="chip" data-place="Plaza San Martín">Plaza San Martín</button>
                    <button type="button" class="chip" data-place="Parque Sarmiento">Parque Sarmiento</button>
                    <button type="button" class="chip" data-place="Plaza España">Plaza España</button>
                </div>
            </div>
            <button type="submit" id="start-btn" class="btn btn-primary">Generar misión con IA</button>
            <p id="status" class="status" role="status" aria-live="polite"></p>
            <p id="error" class="error" role="alert"></p>
        </form>

        <div class="ai-chip">
            <span id="ai-status">🤖 IA: preparando…</span>
            <button type="button" id="ai-enable" class="link-btn" hidden>Activar IA (descarga varios cientos de MB)</button>
        </div>
    </section>

    <!-- PANTALLA 2: RECOGER ESTRELLAS -->
    <section id="screen-game" class="screen" aria-labelledby="title-game" hidden>
        <div class="card mission">
            <div class="mission-top">
                <h2 id="title-game" tabindex="-1" class="eyebrow">Misión en <span id="place-name">…</span></h2>
                <button type="button" id="cancel-btn" class="link-btn">Cambiar lugar</button>
            </div>
            <p id="narrative" class="narrative">Generando…</p>
        </div>

        <div class="hud">
            <div class="hud-item">
                <div id="stars-count" class="stars" aria-live="polite">⭐⭐⭐⭐⭐</div>
                <div class="muted small">Estrellas restantes</div>
            </div>
            <div class="hud-item">
                <div id="timer" class="timer">00:00.00</div>
                <div id="distance" class="muted small">&nbsp;</div>
            </div>
        </div>

        <div id="map" role="application" aria-label="Mapa con las estrellas. Toca una estrella para recogerla."></div>

        <div class="footer">
            <p id="hint" class="hint" role="status" aria-live="polite"></p>
            <button type="button" id="real-toggle" class="btn btn-secondary btn-small" aria-pressed="false">Modo real: desactivado</button>
        </div>
    </section>

    <!-- PANTALLA 3: RESULTADOS -->
    <section id="screen-victory" class="screen center" aria-labelledby="title-victory" hidden>
        <h2 id="title-victory" tabindex="-1" class="victory">¡MISIÓN CUMPLIDA! 🎉</h2>
        <div class="card time-card">
            <p class="eyebrow">Tu tiempo final</p>
            <p id="final-time" class="final-time">00:00.00</p>
            <p id="best-time" class="muted small"></p>
        </div>
        <button type="button" id="again-btn" class="btn btn-primary">Jugar de nuevo</button>
    </section>

    <noscript><p class="error">Star Runner AI necesita JavaScript para funcionar.</p></noscript>
</main>
</body>
</html>
